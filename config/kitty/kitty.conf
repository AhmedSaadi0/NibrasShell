# ============================================
# Kitty config — دعم كامل للعربية + ألوان Plasma
# ============================================

# --- Fonts ---
font_family FantasqueSansM Nerd Font Mono
font_size   15.0

bold_font        auto
italic_font      auto
bold_italic_font auto

disable_ligatures never

# Arabic rendering
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF Noto Naskh Arabic

# --- Appearance ---
background_opacity 0.95
background_blur    5
cursor             #dcb5f3
cursor_text_color  #201c22
cursor_shape       block
cursor_blink_interval 0
window_padding_width 0

# --- Colors: Based on Plasma Theme ---

foreground              #e9e0e8
background              #161217
selection_foreground    #412356
selection_background    #dcb5f3
url_color               #8fc9fc
cursor                  #dcb5f3
cursor_text_color       #201c22

# --- 16-color palette ---
color0  #201c22
color1  #ffb3b4
color2  #00e479
color3  #fcb38a
color4  #8fc9fc
color5  #ebb2ff
color6  #dcb5f3
color7  #e9e0e8

color8  #978e98
color9  #ffb3b4
color10 #00e479
color11 #fcb38a
color12 #8fc9fc
color13 #ebb2ff
color14 #dcb5f3
color15 #ffffff

# --- Borders and Tabs ---
window_border_width     1px
active_border_color     #dcb5f3
inactive_border_color   #45475A

tab_bar_style           powerline
tab_bar_edge            bottom

# --- Behavior & Performance ---
scrollback_lines        10000
enable_audio_bell       no
copy_on_select          yes
mouse_hide_wait         2.0

# --- Key Mappings ---
map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+plus      change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0
map kitty_mod+enter     new_window_with_cwd
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+d         new_split_with_cwd
map kitty_mod+h         neighboring_window left
map kitty_mod+l         neighboring_window right
map kitty_mod+k         neighboring_window up
map kitty_mod+j         neighboring_window down

# --- Shell Integration ---
# shell_integration enabled
force_ltr yes

include colors-matugen.conf
