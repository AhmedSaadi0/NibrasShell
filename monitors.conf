# قواعد الشاشات (المقياس، الدقة، الموضع، الدوران)
# اسم الشاشة من: hyprctl monitors all
# الصيغة: monitor=NAME, RESOLUTION@REFRESH, POSITION, SCALE[, EXTRA]
# مثال: monitor=DP-1, 1920x1080@60Hz, 0x0, 1.25
# مثال المرآة: monitor=DP-2, preferred, auto, 1, mirror,DP-1
#
# تُكتب هذه القواعد تلقائياً عند تغيير أي إعداد من صفحة "الشاشات والعرض"
# داخل إعدادات NibrasShell، فلا حاجة لتعديله يدوياً عادةً.
#
# monitor=eDP-1, 1920x1080@120Hz, 0x0, 1
# monitor=HDMI-A-1, 1920x1080@60Hz, auto-right, 1
